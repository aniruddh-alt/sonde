[project]
name = "sondekit"
version = "0.2.0"
description = "Train portable probes on LLM activations, export them for serving."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The sondekit authors" }]
keywords = ["interpretability", "activation-probes", "linear-probes", "llm", "steering", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
core = [
    "transformers>=5",
    "safetensors>=0.4",
    "pydantic>=2.6",
    "pyyaml>=6",
    "datasets>=4",
]
hf = [
    "sondekit[core]",
    "torch>=2.6",
    "nnterp==1.3.*",
    "nnsight>=0.6,<0.8",
]
vllm = [
    "sondekit[core]",
    "vllm==0.30.0; sys_platform == 'linux'",
    "ninja; sys_platform == 'linux'",
    "nnsight[vllm]>=0.7; sys_platform == 'linux'",
]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pyright==1.1.414"]

[project.urls]
Homepage = "https://github.com/aniruddh-alt/sondekit"
Repository = "https://github.com/aniruddh-alt/sondekit"
Changelog = "https://github.com/aniruddh-alt/sondekit/blob/main/CHANGELOG.md"

[project.scripts]
sondekit = "sondekit.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sondekit*"]

[tool.setuptools.package-data]
sondekit = ["py.typed", "recipes/*.yaml", "recipes/data/*"]

[tool.uv]
conflicts = [[{ extra = "hf" }, { extra = "vllm" }]]

[tool.uv.sources]
# PyPI rejects git dependencies in published metadata, so the nnsight commit
# the vllm backend needs is pinned here, for source installs only.
nnsight = [
    { git = "https://github.com/ndif-team/nnsight", rev = "b71780727ea9713f74ce12f76b1d3548b91a74a0", extra = "vllm" },
]
torch = [
    { index = "pytorch-cpu", extra = "hf", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU; deselect with -m 'not gpu'"]

[tool.ruff]
line-length = 80
force-exclude = true
# fingerprint.py is a verbatim copy of mechanica's; keep it byte-identical
# until mechanica imports it from sondekit.
extend-exclude = ["sondekit/fingerprint.py", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pyright]
include = ["sondekit"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
